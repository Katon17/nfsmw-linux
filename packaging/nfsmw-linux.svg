<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2205"/>
      <stop offset="60%" stop-color="#121008"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a1"/>
      <stop offset="30%" stop-color="#e5b324"/>
      <stop offset="70%" stop-color="#9a7109"/>
      <stop offset="100%" stop-color="#5a3d02"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#goldGleam)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Speedometer Arch / Tachometer Lines -->
  <g transform="translate(256,256)">
    <path d="M -160,80 A 180,180 0 1,1 160,80" fill="none" stroke="#333333" stroke-width="20" stroke-linecap="round"/>
    <path d="M -160,80 A 180,180 0 1,1 100,-150" fill="none" stroke="url(#goldGleam)" stroke-width="20" stroke-linecap="round" filter="url(#dropShadow)"/>
    <path d="M 100,-150 A 180,180 0 0,1 160,80" fill="none" stroke="#d32f2f" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Speedometer Ticks -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#222222" stroke-width="4" stroke-dasharray="4,16"/>

    <!-- BMW M3 GTR iconic double chevron racing stripes -->
    <path d="M -110,-40 L -70,-40 L -20,110 L -60,110 Z" fill="#1565c0" opacity="0.85"/>
    <path d="M -50,-40 L -10,-40 L 40,110 L 0,110 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M 10,-40 L 50,-40 L 100,110 L 60,110 Z" fill="#1565c0" opacity="0.85"/>

    <!-- MW Monogram Letters -->
    <g filter="url(#dropShadow)">
      <!-- NFS Monogram -->
      <text x="0" y="-70" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">NEED FOR SPEED</text>
      <!-- MOST WANTED Logo -->
      <path d="M -140,50 L -100,-30 L -60,20 L -20,-30 L 20,50 L -15,50 L -20,15 L -60,50 L -100,15 L -105,50 Z" fill="url(#goldGleam)"/>
      <path d="M 0,50 L 35,-30 L 70,30 L 105,-30 L 140,50 L 110,50 L 105,15 L 70,50 L 35,15 L 30,50 Z" fill="url(#goldGleam)"/>
      <text x="0" y="80" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#e5b324" text-anchor="middle" letter-spacing="6">BLACK EDITION</text>
    </g>

    <!-- Speed Needle -->
    <polygon points="-6,10 6,10 2,-160 -2,-160" fill="#ff3333" filter="url(#dropShadow)"/>
    <circle cx="0" cy="10" r="14" fill="#111111" stroke="url(#goldGleam)" stroke-width="4"/>
  </g>
</svg>
